<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>বাইতুস সালাম জামে মসজিদ - আয়-ব্যয়ের হিসাব</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;700;800&display=swap" rel="stylesheet"><style id="css">
:root{--bg:#f4f7f4;--card:#fff;--ink:#15302a;--muted:#5b6d67;--line:#dce5df;--green:#1b6a50;--soft:#e2f0e9;--red:#9f3f2d;--gold:#a97a22;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1916;--card:#16241f;--ink:#e6f0ec;--muted:#9bb0a8;--line:#27392f;--green:#5fc29c;--soft:#1b3329;--red:#e08a77;--gold:#d9ae59;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1916;--card:#16241f;--ink:#e6f0ec;--muted:#9bb0a8;--line:#27392f;--green:#5fc29c;--soft:#1b3329;--red:#e08a77;--gold:#d9ae59;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Bengali","Kalpurush","SolaimanLipi",system-ui,sans-serif;line-height:1.7;font-size:16px}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 48px}
.hero{width:100%;height:210px;object-fit:cover;border-radius:12px;display:block}
header{border-bottom:3px double var(--gold);padding:14px 0;margin-bottom:16px}
h1{font-size:1.6rem;line-height:1.35;margin:0;color:var(--green)}
header p{margin:2px 0 10px;color:var(--muted)}
.btn{display:inline-block;padding:6px 14px;border:1px solid var(--green);border-radius:999px;color:var(--green);text-decoration:none;font-weight:600;font-size:.92rem}
.btn:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.notice{background:var(--soft);border-left:4px solid var(--gold);padding:8px 12px;margin-bottom:16px;font-size:.92rem;border-radius:4px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.tabs button{font:inherit;padding:10px 4px;border:0;background:var(--card);color:var(--ink);cursor:pointer}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button[aria-pressed="true"]{background:var(--green);color:var(--card);font-weight:700}
select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);margin:16px 0 8px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.sum div{padding:12px 6px;text-align:center}
.sum div+div{border-left:1px solid var(--line)}
.sum small{display:block;color:var(--muted);font-size:.85rem}
.sum b{font-size:1.1rem}
.in b{color:var(--green)}.out b{color:var(--red)}
h2{font-size:1.15rem;margin:26px 0 8px}
.list{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 14px;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.nm{color:var(--muted);font-size:.88rem;display:block}
.amt{white-space:nowrap;font-weight:600}
.total{background:var(--soft);margin:0 -14px;padding:10px 14px;font-weight:700}
.empty{padding:12px 0;color:var(--muted)}
.team{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.team>div,.docs a,.docs>div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.team small{display:block;color:var(--green);font-weight:600}
.docs{display:grid;gap:8px}
.docs a{display:block;color:var(--ink);text-decoration:none;border-color:var(--green)}
.docs small{display:block;color:var(--muted)}
.adm{display:grid;gap:8px;background:var(--card);border:2px solid var(--gold);border-radius:10px;padding:12px;margin-bottom:10px}
.adm input,.adm select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.pri{font:inherit;padding:10px;border:0;border-radius:8px;background:var(--green);color:var(--card);font-weight:700;cursor:pointer}
.x{border:0;background:transparent;color:var(--red);font-size:1.2rem;cursor:pointer;padding:0 6px;font-family:inherit}
.msg{color:var(--red);min-height:1.6em}
footer{margin-top:28px;color:var(--muted);font-size:.88rem;text-align:center}
@media (max-width:380px){.team{grid-template-columns:1fr}}

body{background:linear-gradient(180deg,var(--soft),var(--bg) 340px) fixed no-repeat,var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.hero-box{position:relative;border-radius:20px;overflow:hidden;box-shadow:0 12px 32px rgba(10,40,30,.22)}
.hero{height:260px;border-radius:0}
.ov{position:absolute;inset:auto 0 0 0;padding:56px 18px 16px;background:linear-gradient(transparent,rgba(4,24,17,.9));color:#fff}
.ov h1{color:#fff;font-size:1.75rem;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.ov p{color:#d7e8e0;margin:2px 0 8px}
.ov .btn{color:#fff;border-color:rgba(255,255,255,.65);background:rgba(255,255,255,.14)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;overflow-x:auto;padding:12px 0;margin-bottom:6px;background:var(--bg);scrollbar-width:none}
nav button{flex:none;font:inherit;padding:7px 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
nav button[aria-current="true"]{background:var(--green);color:var(--card);border-color:var(--green);font-weight:700}
.list,.sum,.adm,.card,.pc,.tg,.tabs,.ph-f{box-shadow:0 3px 14px rgba(20,48,40,.08);border-radius:14px}
h2{display:flex;align-items:center;gap:8px}
h2::before{content:"";width:5px;height:1.1em;border-radius:3px;background:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);padding:14px}
.pre{white-space:pre-wrap}
.sub{color:var(--muted);font-size:.9rem;margin:2px 0 8px}
.tg{display:grid;gap:2px;padding:12px 14px;margin:14px 0 0;border:1px solid var(--line);background:var(--card)}
.tg.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--card))}
.tg.bad strong{color:var(--red)}
.tg.ok strong{color:var(--green)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{position:relative;background:var(--card);border:1px solid var(--line);padding:14px 10px;text-align:center;display:grid;gap:2px;justify-items:center}
.pc small{color:var(--green);font-weight:600}
.pc .sl{font-size:.88rem;color:var(--muted)}
.pc .x{position:absolute;top:4px;right:4px}
.avw{width:68px;height:68px;margin-bottom:4px}
.avw svg{width:100%;height:100%;display:block}
.dn .num{font-size:1.25rem;letter-spacing:.5px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph-f{position:relative;margin:0;background:var(--card);border:1px solid var(--line);overflow:hidden}
.ph-f img{width:100%;height:150px;object-fit:cover;display:block}
.ph-f figcaption{padding:8px 10px;font-size:.9rem}
.ph-f .x{position:absolute;top:4px;right:4px;background:var(--card);border-radius:50%}
.ph{height:150px;display:grid;place-items:center;color:var(--muted);background:var(--soft)}
.zg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.zg label{display:grid;gap:3px;font-size:.88rem;color:var(--muted)}
.zg input,.zg select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
.zr{margin:14px 0;padding:14px;border-radius:14px;background:var(--soft);display:grid;gap:4px}
.zt{font-weight:700;font-size:1.1rem;color:var(--green);margin-top:4px}
.note{font-size:.9rem;color:var(--muted)}
.lg{text-align:center;margin:4px 0 10px;font-size:.9rem}
.dg{color:var(--green)}.dr{color:var(--red)}
.prs{display:flex;gap:8px;flex-wrap:wrap}
.prs .btn{font:inherit;background:var(--card);cursor:pointer}
footer{text-align:center;padding-top:18px;border-top:3px double var(--gold)}
.sorry{max-width:520px;margin:0 auto 8px;color:var(--ink)}
.wa{display:inline-block}
#pa{display:none}
@media (max-width:380px){.cards,.gal,.zg{grid-template-columns:1fr}}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff!important;color:#000}
  body::before{display:none}
  .wrap>*:not(#pa){display:none!important}
  #pa{display:block;font-size:12pt;color:#000}
  #pa h1,#pa h2{text-align:center;color:#000;margin:4px 0}
  #pa h2::before{display:none}

  #pa th,#pa td{border:1px solid #444;padding:4px 8px;text-align:left}
  #pa .r{text-align:right}
  #pa .tt{font-weight:700;background:#eee}
}
.ov{left:0;right:0;text-align:center;padding-left:16px;padding-right:16px}
.ov h1,.ov p{text-align:center;margin-left:auto;margin-right:auto}
.ov .btn{display:inline-block}
.dyn{display:grid;gap:8px}
.dyn:empty{display:none}
.adm textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
#submo{margin-bottom:10px}
.wa{display:inline-block;margin:10px auto 6px}
.wa svg{display:block}

.pc.fld{padding:0}
.fb{font:inherit;color:inherit;background:none;border:0;cursor:pointer;width:100%;padding:16px 8px 12px;display:grid;gap:2px;justify-items:center;border-radius:14px}
.fb small{color:var(--muted);font-weight:400}
.fi{width:56px;height:56px}
.pc .ed{position:absolute;top:4px;left:4px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1.05rem;padding:0 6px}
.bk{font:inherit;background:var(--card);cursor:pointer;margin:12px 0 0}
.ms{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin:6px 0 10px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin:0 0 10px}
.mrow.one{grid-template-columns:1fr}

.mrow .btn{font:inherit;background:var(--card);cursor:pointer;padding:12px 16px;border-radius:12px;text-align:center}
.mnav{display:grid;grid-template-columns:96px 1fr;gap:8px;margin:6px 0}
.mq{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px 6px}
.mq button{font:inherit;font-size:1.5rem;border:0;background:transparent;color:var(--green);cursor:pointer;padding:2px 14px}
.mc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 3px 14px rgba(20,48,40,.08)}
.mh{display:flex;align-items:center;gap:12px}
.mn{flex:none;width:44px;height:44px;border-radius:50%;background:var(--soft);color:var(--green);display:grid;place-items:center;font-weight:700}
.mi{flex:1;min-width:0}
.mi b{display:block}
.mi .nm{display:block;color:var(--muted);font-size:.9rem}
.mm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 8px}
.cell{font:inherit;border:0;border-radius:12px;padding:9px 4px;text-align:center;background:var(--bg);color:var(--ink);display:grid;gap:0;font-size:.92rem}
.cell small{color:var(--muted);font-size:.8rem}
.cell.paid{background:var(--soft);color:var(--green);font-weight:700}
button.cell{cursor:pointer}
.cell.due{color:var(--muted)}
.mr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mr select{flex:1;min-width:150px;padding:6px 8px;font-size:.88rem}
.mr .btn{font:inherit;background:var(--card);cursor:pointer;padding:5px 12px;color:var(--green)}
.mact{display:flex;gap:8px;margin-top:8px}
.mact[hidden]{display:none}
.mact .btn{font:inherit;background:var(--card);cursor:pointer}
.mact .dng{color:var(--red);border-color:var(--red)}
.mdl{position:fixed;inset:0;background:rgba(5,20,15,.55);display:grid;place-items:center;padding:16px;z-index:50}
.mbox{background:var(--card);color:var(--ink);border-radius:16px;padding:16px;width:100%;max-width:420px;display:grid;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.mbox input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.fl{display:grid;gap:3px;font-size:.88rem;color:var(--muted)}
.mbt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbt .btn{font:inherit;background:var(--card);cursor:pointer;text-align:center;padding:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:60;max-width:90%;text-align:center}
.gv{text-align:center}
.glogo{width:96px;height:96px;object-fit:contain;display:block;margin:6px auto 12px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.92rem}
.chk input{width:auto;margin-top:4px}
.adm .fl{font-weight:400}
.pv{display:flex;align-items:center;gap:10px}

function imgData(file, maxW, type) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, maxW / im.width), c = document.createElement("canvas");
      c.width = Math.round(im.width * k);
      c.height = Math.round(im.height * k);
      const x = c.getContext("2d");
      if (type === "image/jpeg") { x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); }
      x.drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      res(c.toDataURL(type, 0.88));
    };
    im.onerror = () => rej(new Error("ছবি পড়া যায়নি"));
    im.src = u;
  });
}

function sumBlock(rows, title) {
  const inc = rows.filter(e => e[1] === "i"), exs = rows.filter(e => e[1] !== "i");
  const by = a => a.sort((x, y) => y.amount - x.amount);
  const incG = by(group(inc)).map(g => [g.label, fmt(g.amount)]);
  const salG = by(group(rows.filter(e => e[1] === "s"))).map(g => ["বেতন — " + g.label, fmt(g.amount)]);
  const expG = by(group(rows.filter(e => e[1] === "e"))).map(g => [g.label, fmt(g.amount)]);
  const ms = new Map();
  rows.forEach(e => { const k = e[0].slice(0, 7), v = ms.get(k) || [0, 0]; v[e[1] === "i" ? 0 : 1] += e[3]; ms.set(k, v); });
  const mrows = [...ms].sort((a, b) => a[0].localeCompare(b[0])).map(([k, [a, b]]) => [label.month(k), fmt(a), fmt(b), fmt(a - b)]);
  const I = tot(inc), O = tot(exs);

function periodInfo(m) {
  const all = ALL();
  if (m === "m3" || m === "m6") {
    const n = m === "m3" ? 3 : 6, now = new Date();
    const s = iso(new Date(now.getFullYear(), now.getMonth() - (n - 1), 1)).slice(0, 7), e = iso(now).slice(0, 7);
    const rows = all.filter(r => { const k = r[0].slice(0, 7); return k >= s && k <= e; });
    return {rows, sumRows: rows, heading: "গত " + bn(n) + " মাসের হিসাব", range: label.month(s) + " থেকে " + label.month(e),
      sumTitle: "গত " + bn(n) + " মাসের সামারি", detTitle: "বিস্তারিত হিসাব"};
  }
  const k = $("per").value;
  if (!k) return null;
  const yr = k.slice(0, 4);
  return {rows: all.filter(r => key[m](r[0]) === k), sumRows: all.filter(r => r[0].slice(0, 4) === yr), heading: MN[m] + " হিসাব: " + label[m](k), range: "",
    sumTitle: yb(yr) + " সালের সামারি (সারা বছরের)",
    detTitle: m === "week" ? label.week(k) + " সপ্তাহের বিস্তারিত হিসাব" : m === "month" ? label.month(k) + " মাসের বিস্তারিত হিসাব" : yb(k) + " সালের বিস্তারিত হিসাব"};
}

function fillPrint(info) {
  const rows = info.rows.slice().sort((a, b) => a[0].localeCompare(b[0]));
  const tbl = (title, rs) => [h("h3", {}, title), tb(["তারিখ", "বিবরণ", "টাকা"], rs.map(e => [dmy(P(e[0])), e[2] + (e[4] ? " (" + e[4] + ")" : ""), fmt(e[3])]), ["", "মোট", fmt(tot(rs))], [2])];
  const inc = rows.filter(e => e[1] === "i"), out = rows.filter(e => e[1] !== "i");
  const I = tot(inc), O = tot(out);
  $("pa").replaceChildren(h("h1", {}, S.mosque), h("p", {class: "c"}, "ঠিকানা: " + S.address), h("h2", {}, info.heading),
    ...(info.range ? [h("p", {class: "c"}, info.range)] : []), h("p", {class: "rsm"}, "হিসেবটি অনলাইন কপি"),
    ...sumBlock(info.sumRows, info.sumTitle),
    h("h3", {class: "sec"}, info.detTitle),
    ...tbl("আয়", inc), ...tbl("ব্যয় (বেতন ও অন্যান্য)", out),
    h("p", {class: "c"}, "মোট আয় " + fmt(I) + " − মোট ব্যয় " + fmt(O) + " = জমা " + fmt(I - O)),
    sigNode());
}

function report(m) {
  if (m === "week" || m === "month" || m === "year") setMode(m);
  const info = periodInfo(m);
  if (!info) return msg("এই সময়ে কোনো তথ্য নেই।");
  fillPrint(info);
  dl(new Blob([docHtml(S.mosque + " - " + RN[m] + " হিসাব", $("pa").innerHTML)], {type: "text/html"}), "mosque-hisab-" + m + ".html");
}

function receipt(m, mo) {
  const p = S.pays.find(x => x.mid === m.id && x.month === mo);
  if (!p) return;
  const no = "R-" + mo.replace("-", "") + "-" + String(S.members.indexOf(m) + 1).padStart(3, "0");
  const rows = [["রসিদ নং", no], ["জমার তারিখ", dmy(P(p.date))], ["সদস্যের নাম", m.name]];
  if (edit && m.phone) rows.push(["মোবাইল", m.phone]);
  rows.push(["চাঁদার মাস", label.month(mo)], ["জমার পরিমাণ", fmt(p.amount)]);
  const box = h("div", {}, h("h1", {}, S.mosque), h("p", {class: "c"}, "ঠিকানা: " + S.address), h("h2", {}, "মাসিক চাঁদার রসিদ"),
    h("p", {class: "rsm"}, "এটি অনলাইন কপি"), tb(["বিবরণ", "তথ্য"], rows, null, []), sigNode());
  dl(new Blob([docHtml(S.mosque + " - চাঁদার রসিদ", box.innerHTML)], {type: "text/html"}), "receipt-" + mo + "-" + no.slice(-3) + ".html");
}

  $("about").textContent = S.about || "আমাদের সম্পর্কে তথ্য শীঘ্রই যোগ করা হবে।";
}

function loginBox() {

  const em = h("input", {type: "email", placeholder: "ইমেইল", autocomplete: "username"});

  const er = h("div", {class: "msg"});
  const box = h("div", {class: "adm", hidden: ""}, em, pw, h("button", {class: "pri", onclick: async () => {
    const r = await sb.auth.signInWithPassword({email: em.value.trim(), password: pw.value});
